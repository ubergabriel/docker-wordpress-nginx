services:
  nginx:
    container_name: nginx
    build: ./nginx/
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ${WORDPRESS_DIR:-./www}:/var/www/html
      - ./nginx/log:/var/log/nginx
    depends_on:
      wordpress:
        condition: service_started
    networks:
      - wordpress
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  wordpress:
    container_name: wordpress
    image: wordpress:${WORDPRESS_TAG:-6.7-php8.3-fpm-alpine}
    restart: unless-stopped
    volumes:
      - ${WORDPRESS_DIR:-./www}:/var/www/html
    init: true
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:?Set WORDPRESS_DB_HOST in Sevalla}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in Sevalla}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in Sevalla}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
    networks:
      - wordpress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "php -v 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  wordpress:
    driver: bridge
